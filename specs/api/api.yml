                    $ref: '#/components/schemas/ProfitShopOutput'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  # ────────────────────────────
  # Profit Shop — Partners（§4.2）
  # ────────────────────────────

  /power-shop/profit-partners:
    get:
      tags:
        - ProfitShop
      summary: 查詢 Partner 列表
      operationId: listProfitPartners
      security:
        - WPNonce: []
      responses:
        '200':
          description: Partner 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PartnerOutput'

    post:
      tags:
        - ProfitShop
      summary: 建立 Partner（admin_only，涉密碼）
      description: |
        Permission: `manage_options`（admin_only_permission）。
        Body 欄位 `password` 不會經過 `sanitize_text_field`（避免 strip tags / collapse 空白破壞密碼字面值），
        會以 `wp_hash_password` 雜湊後存於 termmeta。
      operationId: createProfitPartner
      security:
        - WPNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerInput'
      responses:
        '201':
          description: 建立成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    $ref: '#/components/schemas/PartnerOutput'
        '400':
          description: validation_failed（slug 格式錯誤等）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '409':
          description: slug_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-partners/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Partner term ID
        schema:
          type: integer

    get:
      tags:
        - ProfitShop
      summary: 取得單一 Partner
      operationId: getProfitPartner
      security:
        - WPNonce: []
      responses:
        '200':
          description: Partner 詳情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    $ref: '#/components/schemas/PartnerOutput'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

    put:
      tags:
        - ProfitShop
      summary: 更新 Partner（admin_only，涉密碼）
      operationId: updateProfitPartner
      security:
        - WPNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerInput'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    $ref: '#/components/schemas/PartnerOutput'
        '400':
          description: validation_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '409':
          description: slug_conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

    delete:
      tags:
        - ProfitShop
      summary: 刪除 Partner（admin_only；is_in_use 預檢）
      description: |
        Permission: `manage_options`。
        如該 Partner 仍被現存賣場引用，回 409 `partner_in_use`。
      operationId: deleteProfitPartner
      security:
        - WPNonce: []
      responses:
        '200':
          description: 刪除成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      deleted:
                        type: boolean
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '409':
          description: partner_in_use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-partners/{id}/regenerate-password:
    post:
      tags:
        - ProfitShop
      summary: 重新產生 Partner 密碼（admin_only）
      description: |
        Permission: `manage_options` + 額外 `X-WP-Nonce` 驗證（reviewer follow-up T-4.1，防 CSRF）。
        產生 12 字元 `wp_generate_password`，雜湊存 termmeta，回傳明文（前端必須立即顯示後丟棄）。

        Response header **強制**：
          - `Cache-Control: no-store, no-cache, must-revalidate`
          - `Pragma: no-cache`

        副作用：bump partner 的 `password_changed_at`，所有先前已發出的 token 將失效（Phase 3-D Batch 2）。
      operationId: regenerateProfitPartnerPassword
      security:
        - WPNonce: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 新密碼（裸 payload，與 partner endpoint 慣例一致）
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                example: 'no-store, no-cache, must-revalidate'
            Pragma:
              required: true
              schema:
                type: string
                example: 'no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegeneratePasswordOutput'
        '403':
          description: 無權限 / nonce 失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-partners/{id}/set-password:
    post:
      tags:
        - ProfitShop
      summary: 站長指定 Partner 密碼（admin_only）
      description: |
        Permission: `manage_options` + 額外 `X-WP-Nonce` 驗證（防 CSRF，與 regenerate-password 同一條紀律）。

        與 `regenerate-password` **並存**，用途不同：
          - `regenerate-password`：夥伴忘記密碼 / 疑似外洩，一鍵重設成系統產生的強密碼
          - 本端點：站長要主動把一組自己知道的密碼交給夥伴

        密碼強度由 `PartnerPassword` VO 驗證（≥ 8 codepoint + ≥ 1 英文 + ≥ 1 數字），
        不合格回 422 `weak_password` + `data.reasons[]`。

        ⚠️ body 的 `password` **不過** `sanitize_text_field`（走 `read_json_body_for_partner()`
        的 `PARTNER_RAW_FIELDS`）——否則密碼裡的 `<` / `>` / 連續空白會被靜默改寫，
        症狀是「站長設的密碼夥伴登不進去」且毫無錯誤訊息。

        ⚠️ Response **不回傳密碼明文**（這是與 regenerate-password 的關鍵差異）：
        站長自己輸入的密碼他本來就知道，回傳只會多一個洩漏面。

        Response header **強制**：
          - `Cache-Control: no-store, no-cache, must-revalidate`
          - `Pragma: no-cache`

        副作用：bump partner 的 `password_changed_at`，該夥伴所有先前已發出的 token 立即失效。
      operationId: setProfitPartnerPassword
      security:
        - WPNonce: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  minLength: 8
                  description: 站長指定的明文密碼（≥ 8 codepoint + ≥ 1 英文 + ≥ 1 數字）
      responses:
        '200':
          description: 設定成功（裸 payload，**不含**密碼）
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                example: 'no-store, no-cache, must-revalidate'
            Pragma:
              required: true
              schema:
                type: string
                example: 'no-cache'
          content:
            application/json:
              schema:
                type: object
                required:
                  - partner_id
                  - password_changed_at
                properties:
                  partner_id:
                    type: integer
                  password_changed_at:
                    type: integer
                    description: 密碼變更時間（unix timestamp）；舊 token 撤銷的依據
        '403':
          description: 無權限 / nonce 失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '422':
          description: weak_password（含 data.reasons[]）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  # ────────────────────────────
  # Profit Shop — Migration（§4.7）
  # ────────────────────────────

  /power-shop/profit-migration/legacy-shops:
    get:
      tags:
        - ProfitShop
      summary: 列出可遷入的 legacy 一頁商店（admin_only）
      operationId: listImportableLegacyShops
      security:
        - WPNonce: []
      responses:
        '200':
          description: legacy shops 清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LegacyShopRef'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-migration/import:
    post:
      tags:
        - ProfitShop
      summary: 匯入 legacy 一頁商店（admin_only，強制 partner_term_id）
      operationId: importLegacyShop
      security:
        - WPNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - legacy_id
                - partner_term_id
              properties:
                legacy_id:
                  type: integer
                partner_term_id:
                  type: integer
                  description: 必填；匯入的 ProfitShop 必須掛在某個 partner 下
      responses:
        '201':
          description: 匯入成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    $ref: '#/components/schemas/ProfitShopOutput'
        '400':
          description: validation_failed（缺 legacy_id / partner_term_id）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '404':
          description: not_found（legacy 或 partner 不存在）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '422':
          description: legacy_unimportable（含 reason）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  # ────────────────────────────
  # Profit Shop — Partner Auth（§4.4，public + partner_token）
  #
  # 重要慣例（與 admin endpoint 不同）：
  #   - Response **不裹** `{code, data}`，body 直接是 payload
  #   - 認證走 partner_token（X-Partner-Token / Bearer / Cookie 三條路徑）
  #   - login 設置 Cookie：HttpOnly + Secure + SameSite=Lax + Path=/wp-json/power-shop/ + Max-Age=3600
  # ────────────────────────────

  /power-shop/partner-auth/login:
    post:
      tags:
        - ProfitShopPartnerAuth
      summary: Partner 登入（public）
      description: |
        Permission: public。
        Body 欄位 `password` 不經 `sanitize_text_field`（保留密碼字面值），
        以 `wp_check_password` 比對 termmeta 雜湊。

        **Rate limit**：per-slug + per-IP，5 次失敗鎖 15 分鐘（reviewer M-2 / L-3）。
        達上限回 429 `rate_limited` + `Retry-After` header。

        **Set-Cookie**：
          - 名稱 `profit_partner_token`
          - 屬性 `HttpOnly; Secure; SameSite=Lax; Path=/wp-json/power-shop/; Max-Age=3600`

        失敗回應對未知 slug **不** record_failure（避免 timing oracle 暴露 slug 存在性）。
      operationId: partnerLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerLoginInput'
      responses:
        '200':
          description: 登入成功（裸 payload，附 Set-Cookie）
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
                example: 'profit_partner_token=abc...; HttpOnly; Secure; SameSite=Lax; Path=/wp-json/power-shop/; Max-Age=3600'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerLoginOutput'
        '400':
          description: validation_failed（slug / password 為空）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '401':
          description: unauthorized（InvalidCredentials；統一回應，不分 slug 不存在 vs 密碼錯誤）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '429':
          description: rate_limited（含 retry_after + Retry-After header）
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/partner-auth/logout:
    post:
      tags:
        - ProfitShopPartnerAuth
      summary: Partner 登出（public，idempotent）
      description: |
        Permission: public（即使無 token 也回 200，行為 idempotent）。
        若有 token 會 revoke transient + 寫 Set-Cookie `Max-Age=0` 清 Cookie。
      operationId: partnerLogout
      security: []
      parameters:
        - $ref: '#/components/parameters/PartnerToken'
        - $ref: '#/components/parameters/AuthBearer'
        - $ref: '#/components/parameters/PartnerCookie'
      responses:
        '200':
          description: 已登出（裸 payload）
          headers:
            Set-Cookie:
              schema:
                type: string
                example: 'profit_partner_token=; HttpOnly; Secure; SameSite=Lax; Path=/wp-json/power-shop/; Max-Age=0'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutOutput'

  /power-shop/partner-auth/me:
    get:
      tags:
        - ProfitShopPartnerAuth
      summary: 取得當前 Partner 資訊（partner_token）
      operationId: partnerMe
      security:
        - PartnerToken: []
        - PartnerBearer: []
        - PartnerCookie: []
      responses:
        '200':
          description: Partner 公開資訊（裸 payload）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerMeOutput'
        '401':
          description: unauthorized（token 缺失 / 已過期 / 已 revoke）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/partner-auth/change-password:
    post:
      tags:
        - ProfitShopPartnerAuth
      summary: Partner 自助修密碼（partner_token，Phase 6-A1）
      description: |
        Permission: `partner_token`（cookie / X-Partner-Token / Bearer 三選一）。
        對應規格 §6.3。

        **partner_term_id 鎖死於 token**：permission_callback 從 token 解出後寫入
        `_partner_term_id`，**永不**從 body / query 取（防 cross-partner 越權）。
        V2Api callback 對 `_partner_term_id <= 0` 立即拋（reviewer L-4 fail-fast，
        防 permission 流程缺陷被繞過時污染 `pwchange:0` rate-limit 維度）。

        **Body 不過 sanitize_text_field**（避免 strip tags / collapse 空白破壞密碼字面值）。

        **流程**（嚴格順序）：
          1. assert_not_blocked（pseudo-slug `pwchange:{partner_term_id}` + IP 雙維度，
             與 partner login slug 維度**隔離**：登入失敗鎖不影響改密、改密失敗鎖不影響登入）
          2. find_by_id → null 拋 PartnerNotFound（不 record_failure，避免 unknown id 噪音）
          3. verify_password（current_password）→ false：record_failure → InvalidCredentials
          4. new PartnerPassword(new_password)：弱密碼拋 WeakPassword（rate-limit 不動，
             避免使用者按錯 5 次格式就被鎖）
          5. PartnerRepository::save（內部 update `_partner_password_changed_at` termmeta）
          6. reset 雙維度 rate-limit
          7. audit log（不含明文密碼 / hash / token）
          8. 回 `{success: true, password_changed_at: int}`

        **Success 副作用**：
          - `Set-Cookie profit_partner_token=; Max-Age=0`：強制 partner 重新登入
            （path 與 set 時一致才能清除）
          - `Cache-Control: no-store, no-cache, must-revalidate` + `Pragma: no-cache`：
            防 proxy / browser 快取響應內容
          - 舊 token 在 `PartnerTokenStore::verify` 比對 `issued_at <= password_changed_at`
            立即失效（Phase 6-A1 reviewer M-1 同秒撤銷契約）

        **密碼複雜度規則**（PartnerPassword ValueObject，spec §6.3）：
          - `too_short`：mb_strlen UTF-8 < 8
          - `missing_letter`：不含 `[a-zA-Z]`
          - `missing_digit`：不含 `[0-9]`
          - 違反時 422 weak_password 攜帶 `data.reasons[]`（cumulative）

        **安全紀律**（不可違反）：
          - response 永不洩漏密碼明文 / hash / token
          - audit log 不含明文密碼
          - admin nonce 不能走此 endpoint（permission 非 WPNonce）
      operationId: partnerChangePassword
      security:
        - PartnerToken: []
        - PartnerBearer: []
        - PartnerCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 改密成功（裸 payload，附 Set-Cookie 清空 + Cache-Control no-store）
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
                example: 'profit_partner_token=; HttpOnly; Secure; SameSite=Lax; Path=/wp-json/power-shop/; Max-Age=0'
            Cache-Control:
              required: true
              schema:
                type: string
                example: 'no-store, no-cache, must-revalidate'
            Pragma:
              required: true
              schema:
                type: string
                example: 'no-cache'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          description: validation_failed（欄位缺失 / `_partner_term_id <= 0` fail-fast）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '401':
          description: unauthorized（current_password 錯，已 record_failure 雙維度）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '422':
          description: weak_password（new_password 不符複雜度，含 data.reasons[]，未 record_failure）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '429':
          description: rate_limited（pseudo-slug 或 IP 達 5 次失敗，含 Retry-After header）
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  # ────────────────────────────
  # Profit Shop — Partner Reports（§4.5，partner_token only）
  #
  # 安全 invariant：
  #   - partner_term_id 鎖死於 token，permission_callback 寫入 `_partner_term_id`
  #   - **永不**從 query string 讀 partner_term_id（防 cross-partner 越權）
  #   - WP_REST_Request::set_param 會覆寫所有 buckets 中的同名 key，
  #     即使 attacker 帶 `?_partner_term_id=999` 也會被覆寫為 token 解出的真值
  # ────────────────────────────

  /power-shop/partner-reports/kpi:
    get:
      tags:
        - ProfitShopPartnerReports
      summary: Partner KPI 報表
      description: |
        partner_term_id 由 token 鎖死，**禁止**作為 query parameter 出現。
      operationId: getPartnerKpi
      security:
        - PartnerToken: []
        - PartnerBearer: []
        - PartnerCookie: []
      parameters:
        - name: date_start
          in: query
          schema:
            type: integer
            description: unix timestamp 起點
        - name: date_end
          in: query
          schema:
            type: integer
            description: unix timestamp 終點
        - name: shop_ids
          in: query
          description: 逗號分隔賣場 ID（可選；屬於同一 partner 的 shop）
          schema:
            type: string
        - name: statuses
          in: query
          description: 逗號分隔狀態（pending / paid / refunded）
          schema:
            type: string
      responses:
        '200':
          description: KPI（裸 payload）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiOutput'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/partner-reports/trend:
    get:
      tags:
        - ProfitShopPartnerReports
      summary: Partner 趨勢報表
      description: |
        partner_term_id 由 token 鎖死，**禁止**作為 query parameter。
      operationId: getPartnerTrend
      security:
        - PartnerToken: []
        - PartnerBearer: []
        - PartnerCookie: []
      parameters:
        - name: interval
          in: query
          schema:
            type: string
            enum:
              - day
              - week
              - month
            default: day
        - name: date_start
          in: query
          schema:
            type: integer
        - name: date_end
          in: query
          schema:
            type: integer
        - name: shop_ids
          in: query
          schema:
            type: string
        - name: statuses
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 趨勢序列（裸 payload）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrendOutput'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/partner-reports/settlements:
    get:
      tags:
        - ProfitShopPartnerReports
      summary: Partner 結算列表
      description: |
        partner_term_id 由 token 鎖死，**禁止**作為 query parameter。
        page 上限 cap=10000（reviewer LOW-T5-2，防 OFFSET 巨大查詢拖庫）。
      operationId: listPartnerSettlements
      security:
        - PartnerToken: []
        - PartnerBearer: []
        - PartnerCookie: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: date_start
          in: query
          schema:
            type: integer
        - name: date_end
          in: query
          schema:
            type: integer
        - name: shop_ids
          in: query
          schema:
            type: string
        - name: statuses
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 結算列表 + 分頁中介資料（裸 payload）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementListOutput'
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  # ────────────────────────────
  # Settlements（後台結算頁，spec §3.5 / §4.3 / §5.5）
  #
  # 🔴 Permission：七個端點**一律** manage_options，連唯讀的列表 / 摘要也是。
  #   規格 query-settlements.feature 與 export-settlements-csv.feature 都明文斷言
  #   「僅具商店管理權限」→ 403。結算頁緊鄰「標記已撥款」這個不可逆的金流動作，
  #   讓 shop_manager 看得到金額卻按不了按鈕只會讓人繞路（截圖、口頭轉述），
  #   整頁同一個邊界才一致。⚠️ 這比 spec §6.1 的 manage_woocommerce 嚴格；
  #   兩份文件不一致時以 feature 為準（較新且是可執行的驗收條件）。
  #   三個 mutation 另外要求 X-WP-Nonce：capability 擋「你是誰」、
  #   nonce 擋「這請求是不是你自己發的」，兩者防的不是同一件事。
  #
  # 回應一律是 admin endpoint 的 {code, message, data} 包裝（**不是** partner 端點的裸 payload）。
  # ────────────────────────────

  /power-shop/profit-settlements:
    get:
      tags:
        - Settlement
      summary: 後台結算列表（跨 partner）
      description: |
        依 partner / 賣場 / 狀態 / 日期區間過濾的結算明細（spec §3.5）。
        已取消 / 失敗 / trash / auto-draft 訂單的 line item 一律排除，
        避免無效訂單污染撥款金額。

        `total` 是符合條件的**總筆數**（另一次 count 查詢），不是當前頁筆數。
      operationId: listProfitSettlements
      security:
        - WPNonce: []
      parameters:
        - name: partner_id
          in: query
          description: 分潤夥伴 term ID（可複數或逗號分隔；亦接受 partner_ids / partner_term_id[s]）
          schema:
            type: string
        - name: shop_id
          in: query
          description: 賣場 ID（可複數或逗號分隔；亦接受 shop_ids）
          schema:
            type: string
        - name: status
          in: query
          description: 結算狀態（可複數或逗號分隔；亦接受 statuses）
          schema:
            type: string
            enum: [pending, paid, refunded, cancelled]
        - name: date_start
          in: query
          description: 訂單建立起始時間（unix timestamp）
          schema:
            type: integer
        - name: date_end
          in: query
          description: 訂單建立結束時間（unix timestamp）
          schema:
            type: integer
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 10000
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 結算列表 + 分頁中介資料
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/AdminSettlementListOutput'
        '400':
          description: |
            validation_failed。最常見成因：`status` 帶了白名單以外的值。
            **刻意不靜默忽略**——忽略會讓過濾條件退化成「不過濾」，
            站長看到全部品項卻以為自己在看篩選子集。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '401':
          description: 未登入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '403':
          description: 權限不足（需 manage_options；僅具 manage_woocommerce 者一律 403）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-settlements/order-ids:
    get:
      tags:
        - Settlement
      summary: 取得符合分潤條件的訂單 ID 清單
      description: |
        決策 D-6。WooCommerce REST 的 `orders` 端點無法依 order item meta 篩選，
        前端得先向本端點取回 order_id 陣列，再當成 `wc-rest` 的 `include` filter 送出。

        ⚠️ `include` 走 query string、過長會被伺服器截斷或拒絕，因此硬性 cap 在 200。
        回應的 `truncated` 為 true 時前端**必須**提示站長縮小範圍。
      operationId: listProfitSettlementOrderIds
      security:
        - WPNonce: []
      parameters:
        - name: shop_id
          in: query
          description: 賣場 ID（可複數或逗號分隔）
          schema:
            type: string
        - name: partner_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, refunded, cancelled]
        - name: date_start
          in: query
          schema:
            type: integer
        - name: date_end
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          description: 上限（只能小於等於 200；超過一律 clamp）
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        '200':
          description: 訂單 ID 清單
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/SettlementOrderIdsOutput'
        '400':
          description: validation_failed（status 不在白名單）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '401':
          description: 未登入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '403':
          description: 權限不足（需 manage_options）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-settlements/summary:
    get:
      tags:
        - Settlement
      summary: 後台結算摘要卡
      description: |
        待撥款 / 已撥款 / 退款的金額與筆數（spec §3.5）。
        與列表端點吃**完全相同**的過濾條件——兩者若不同步，摘要卡金額會與表格
        對不起來，而站長是照卡片金額去轉帳的。摘要忽略 page / per_page。
      operationId: getProfitSettlementSummary
      security:
        - WPNonce: []
      parameters:
        - name: partner_id
          in: query
          schema:
            type: string
        - name: shop_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, paid, refunded, cancelled]
        - name: date_start
          in: query
          schema:
            type: integer
        - name: date_end
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 摘要卡數據
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/SettlementAdminSummaryOutput'
        '400':
          description: validation_failed（status 不在白名單）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '401':
          description: 未登入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '403':
          description: 權限不足（需 manage_options；僅具 manage_woocommerce 者一律 403）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-settlements/mark-paid:
    post:
      tags:
        - Settlement
      summary: 批次標記已撥款（pending → paid）
      description: |
        spec §5.5。**只有 `pending` 會被轉換**，其餘一律進 `skipped` 並附原因。

        🔴 併發防護走**條件式 UPDATE（compare-and-set）**，不是 read-check-write：
        `UPDATE ... SET meta_value='paid' WHERE meta_key='_settlement_status' AND meta_value='pending'`，
        以 affected rows 判定誰搶到。兩位管理員同時按下撥款時，資料庫的 row lock
        保證只有一個請求拿到 1；先讀出狀態再檢查再寫入的做法**會讓兩邊都通過檢查、
        都寫入，站長真的轉兩次帳**。

        沒搶到的請求不會寫 `_settled_at` / `_settled_by`（那是「誰在何時撥的款」的
        稽核證據），且回應會明確列出「本次未重複計入」的 id——靜默略過會讓第二位
        管理員以為自己那次沒生效而真的再轉一次帳。

        成功的品項會依 partner 分組寫入 termmeta `_partner_settled_log`
        （type=`settle`，spec §7.5），每個 partner 只會看到自己的金額。

        **需要 `X-WP-Nonce`**（CSRF 防禦）。
      operationId: markProfitSettlementsPaid
      security:
        - WPNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementBatchRequest'
      responses:
        '200':
          description: |
            批次結果。注意：即使 `updated_ids` 為空也是 200——
            「全部都已處理過」是正常狀態，不是錯誤。
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/SettlementBatchOutput'
        '400':
          description: validation_failed（清單為空 / 超過 500 筆 / 無法辨識操作者身分）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '401':
          description: 未登入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '403':
          description: 權限不足（需 manage_options）或缺少有效的 X-WP-Nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-settlements/mark-cancelled:
    post:
      tags:
        - Settlement
      summary: 批次標記取消（pending → cancelled）
      description: |
        用於「訂單成立但不該計入分潤」（測試單 / 內部單 / 夥伴自己下的單）。

        與 mark-paid 的兩個關鍵差異：
          1. **不寫** `_settled_at` / `_settled_by`——取消不是撥款，污染那兩欄會讓
             任何以 `_settled_at` 統計實際撥款的報表算進根本沒撥出去的品項。
          2. **`paid` 不可轉 cancelled**（錢已撥出，改成「取消」等於帳面上抹掉一筆
             真實支出）。要沖回請用 `reverse-paid`。

        稽核紀錄 type=`cancel`。**需要 `X-WP-Nonce`**。
      operationId: markProfitSettlementsCancelled
      security:
        - WPNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementBatchRequest'
      responses:
        '200':
          description: 批次結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/SettlementBatchOutput'
        '400':
          description: validation_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '401':
          description: 未登入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '403':
          description: 權限不足（需 manage_options）或缺少有效的 X-WP-Nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-settlements/reverse-paid:
    post:
      tags:
        - Settlement
      summary: 批次人工沖回（paid → refunded）
      description: |
        錢已撥給夥伴之後才發生退款 / 爭議時，在系統裡留下「這筆已撥款被沖回」的紀錄，
        供下次撥款扣抵（spec §4.3 / §5.3 / §7.9）。

        **只允許 `paid` → `refunded`**。Domain 狀態機同時接受 `pending → refunded`，
        但那在「人工沖回」語意下是錯的：一筆根本還沒撥出去的款會產生
        `refund_after_paid` 稽核紀錄，站長下次撥款照此扣抵 → **少付夥伴一次**，
        而該筆也不會再出現在待撥款清單。因此本端點有一道獨立的
        `status === paid` 前置檢查，不符者一律進 `skipped`。
        pending 要作廢請改用 `mark-cancelled`。

        稽核紀錄 type=`refund_after_paid`（spec §7.5 指定）。**需要 `X-WP-Nonce`**。
      operationId: reverseProfitSettlementsPaid
      security:
        - WPNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementBatchRequest'
      responses:
        '200':
          description: 批次結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/SettlementBatchOutput'
        '400':
          description: validation_failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '401':
          description: 未登入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '403':
          description: 權限不足（需 manage_options）或缺少有效的 X-WP-Nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-settlements/export:
    post:
      tags:
        - Settlement
      summary: 匯出結算明細 CSV
      description: |
        匯出**整個篩選結果**（不只當前頁）——只給螢幕上那 20 筆對帳沒有意義，
        因此本端點忽略傳入的 `page`，自行從第 1 頁逐塊抓到 5000 列上限。

        過濾條件走 body（partner / shop 多選會讓 query string 過長）；
        `page` 以外的條件與列表端點完全一致。

        回應仍是 `{code, data}` 包裝、`data.content` 是 CSV 全文，
        由前端 `new Blob([content], { type: mime_type })` 觸發下載——
        直接回 `text/csv` 會讓 admin 端點多一種例外形狀，前端得為單一端點另開通道。

        安全：每一格都做試算表公式注入中和（spec §6.9）；回應帶
        `Cache-Control: no-store`（內容含全站分潤金額）。
      operationId: exportProfitSettlements
      security:
        - WPNonce: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettlementFilterInput'
      responses:
        '200':
          description: |
            CSV 內容（base64）。匯出範圍等同當下的篩選條件——所見即所得。
            規格明訂「系統一次產出整份檔案，不提供背景排程或分批下載」，
            因此**沒有業務層的筆數上限**（內部逐塊查詢只是為了避免單次 SQL 拉回巨量結果）。
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store, no-cache, must-revalidate
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: success
                  data:
                    $ref: '#/components/schemas/SettlementExportOutput'
        '400':
          description: validation_failed（status 不在白名單）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '401':
          description: 未登入
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '403':
          description: 權限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
