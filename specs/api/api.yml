openapi: 3.0.0
info:
  title: Power Shop API
  version: 2.0.0
  description: >-
    Power Shop WordPress Plugin REST API。
    涵蓋自有端點（power-shop namespace）、WooCommerce REST API（wc/v3）、
    WordPress REST API（wp/v2）。認證使用 X-WP-Nonce header 搭配 WordPress Cookie。

servers:
  - url: /wp-json
    description: WordPress REST API 基礎路徑

security:
  - WPNonce: []

components:
  securitySchemes:
    WPNonce:
      type: apiKey
      in: header
      name: X-WP-Nonce
      description: WordPress REST API Nonce，搭配 Cookie 認證使用。
    PartnerToken:
      type: apiKey
      in: header
      name: X-Partner-Token
      description: |
        Partner token（spec §4.5 / §6.3）。優先級鏈（高 → 低）：
          1. `X-Partner-Token: {token}`
          2. `Authorization: Bearer {token}`
          3. Cookie `profit_partner_token`
        三選一即可，三條路徑全部由同一個 partner_token_permission callback 解析。
        驗證後 partner_term_id 鎖死於 caller，永不從 query string 讀。
    PartnerBearer:
      type: http
      scheme: bearer
      bearerFormat: PartnerToken
    PartnerCookie:
      type: apiKey
      in: cookie
      name: profit_partner_token

  schemas:

    Address:
      type: object
      description: 地址物件（帳單 / 配送）
      properties:
        first_name:
          type: string
        last_name:
          type: string
        company:
          type: string
        address_1:
          type: string
        address_2:
          type: string
        city:
          type: string
        state:
          type: string
        postcode:
          type: string
        country:
          type: string
          description: ISO 3166-1 alpha-2 國家代碼
        email:
          type: string
          format: email
          description: 僅帳單地址使用
        phone:
          type: string
          description: 僅帳單地址使用

    MetaData:
      type: object
      description: WooCommerce / WordPress Meta 資料
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
        value:
          description: 任意型別（string / number / object / array）

    Image:
      type: object
      description: 圖片物件
      properties:
        id:
          type: integer
        src:
          type: string
          format: uri
        name:
          type: string
        alt:
          type: string

    OrderItem:
      type: object
      description: 訂單商品項目
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        product_id:
          type: integer
        variation_id:
          type: integer
          default: 0
        quantity:
          type: integer
          minimum: 1
        tax_class:
          type: string
        subtotal:
          type: string
          description: 商品小計（不含稅）
        subtotal_tax:
          type: string
        total:
          type: string
          description: 商品總計（不含稅，含折扣）
        total_tax:
          type: string
        sku:
          type: string
          readOnly: true
        price:
          type: number
          readOnly: true
        meta_data:
          type: array
          items:
            $ref: '#/components/schemas/MetaData'

    Order:
      type: object
      description: 訂單
      properties:
        id:
          type: integer
          readOnly: true
        number:
          type: string
          readOnly: true
          description: 訂單顯示編號，如 #1001
        status:
          type: string
          enum:
            - pending
            - processing
            - on-hold
            - completed
            - cancelled
            - refunded
            - failed
          default: pending
        customer_id:
          type: integer
          nullable: true
          description: 0 表示訪客訂單
        billing:
          $ref: '#/components/schemas/Address'
        shipping:
          $ref: '#/components/schemas/Address'
        line_items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
        total:
          type: string
          readOnly: true
        subtotal:
          type: string
          readOnly: true
        total_tax:
          type: string
          readOnly: true
        shipping_total:
          type: string
          readOnly: true
        discount_total:
          type: string
          readOnly: true
        payment_method:
          type: string
        payment_method_title:
          type: string
        transaction_id:
          type: string
        date_created:
          type: string
          format: date-time
          readOnly: true
        date_modified:
          type: string
          format: date-time
          readOnly: true
        meta_data:
          type: array
          items:
            $ref: '#/components/schemas/MetaData'

    OrderNote:
      type: object
      description: 訂單備註
      properties:
        id:
          type: integer
          readOnly: true
        note:
          type: string
        customer_note:
          type: boolean
          default: false
          description: true 表示顯示給顧客並觸發通知 email
        author:
          type: string
          readOnly: true
        date_created:
          type: string
          format: date-time
          readOnly: true

    VariationAttribute:
      type: object
      description: 變體屬性值
      properties:
        name:
          type: string
        option:
          type: string

    ProductAttribute:
      type: object
      description: 商品屬性
      properties:
        id:
          type: integer
          default: 0
        name:
          type: string
        position:
          type: integer
          default: 0
        visible:
          type: boolean
          default: true
        variation:
          type: boolean
          default: false
        options:
          type: array
          items:
            type: string

    CategoryRef:
      type: object
      description: 分類參照
      properties:
        id:
          type: integer
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true

    TagRef:
      type: object
      description: 標籤參照
      properties:
        id:
          type: integer
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true

    Product:
      type: object
      description: 商品
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        slug:
          type: string
        type:
          type: string
          enum:
            - simple
            - variable
            - grouped
            - external
            - subscription
            - variable-subscription
          default: simple
        status:
          type: string
          enum:
            - publish
            - draft
            - trash
          default: draft
        description:
          type: string
        short_description:
          type: string
        sku:
          type: string
        gtin:
          type: string
        regular_price:
          type: string
          description: 格式為數字字串，如 "299.00"；regular_price >= 0
        sale_price:
          type: string
          description: sale_price <= regular_price；空字串表示無特價
        date_on_sale_from:
          type: string
          format: date-time
          nullable: true
        date_on_sale_to:
          type: string
          format: date-time
          nullable: true
        manage_stock:
          type: boolean
          default: false
        stock_quantity:
          type: integer
          nullable: true
        stock_status:
          type: string
          enum:
            - instock
            - outofstock
            - onbackorder
          default: instock
        backorders:
          type: string
          enum:
            - 'no'
            - notify
            - 'yes'
          default: 'no'
        low_stock_amount:
          type: integer
          nullable: true
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryRef'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/TagRef'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
        variations:
          type: array
          items:
            type: integer
          readOnly: true
          description: 變體 ID 陣列（variable 商品，唯讀）
        upsell_ids:
          type: array
          items:
            type: integer
        cross_sell_ids:
          type: array
          items:
            type: integer
        grouped_products:
          type: array
          items:
            type: integer
          description: grouped 商品子項 ID
        purchase_note:
          type: string
        menu_order:
          type: integer
          default: 0
        external_url:
          type: string
          description: external 商品用
        button_text:
          type: string
          description: external 商品按鈕文字
        meta_data:
          type: array
          items:
            $ref: '#/components/schemas/MetaData'

    ProductVariation:
      type: object
      description: 商品變體
      properties:
        id:
          type: integer
          readOnly: true
        parent_id:
          type: integer
          readOnly: true
        sku:
          type: string
        regular_price:
          type: string
        sale_price:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - publish
            - private
          default: publish
        manage_stock:
          type: boolean
          default: false
        stock_quantity:
          type: integer
          nullable: true
        stock_status:
          type: string
          enum:
            - instock
            - outofstock
            - onbackorder
          default: instock
        image:
          $ref: '#/components/schemas/Image'
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/VariationAttribute'
          description: 對應父商品 variation=true 的所有屬性
        meta_data:
          type: array
          items:
            $ref: '#/components/schemas/MetaData'

    ProductCategory:
      type: object
      description: 商品分類
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        slug:
          type: string
        parent:
          type: integer
          default: 0
          description: 0 表示頂層分類；自我參照
        description:
          type: string
        image:
          $ref: '#/components/schemas/Image'
        count:
          type: integer
          readOnly: true
          description: 該分類下商品數量（唯讀）
        menu_order:
          type: integer
          default: 0

    Customer:
      type: object
      description: 顧客
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        username:
          type: string
        role:
          type: string
          readOnly: true
          default: customer
        billing:
          $ref: '#/components/schemas/Address'
        shipping:
          $ref: '#/components/schemas/Address'
        is_paying_customer:
          type: boolean
          readOnly: true
          default: false
        orders_count:
          type: integer
          readOnly: true
          default: 0
        total_spent:
          type: string
          readOnly: true
          description: 總消費金額，格式為數字字串
        last_order:
          type: object
          nullable: true
          readOnly: true
          properties:
            id:
              type: integer
            date:
              type: string
              format: date-time
        avatar_url:
          type: string
          format: uri
          readOnly: true
        date_created:
          type: string
          format: date-time
          readOnly: true
        date_modified:
          type: string
          format: date-time
          readOnly: true
        meta_data:
          type: array
          items:
            $ref: '#/components/schemas/MetaData'

    CustomerNote:
      type: object
      description: 顧客聯繫備註（Power Shop 自有）
      properties:
        id:
          type: integer
          readOnly: true
        customer_id:
          type: integer
          readOnly: true
        author_id:
          type: integer
          description: 建立備註的操作者 WP User ID
        author_name:
          type: string
          readOnly: true
        content:
          type: string
        date_created:
          type: string
          format: date-time
          readOnly: true

    DashboardStats:
      type: object
      description: Dashboard KPI 統計
      properties:
        period:
          type: string
          enum:
            - today
            - yesterday
            - week
            - month
            - year
            - custom
        date_start:
          type: string
          format: date
        date_end:
          type: string
          format: date
        total_sales:
          type: number
          format: double
          description: 總銷售額
        total_orders:
          type: integer
          description: 總訂單數
        total_customers:
          type: integer
          description: 新增顧客數
        average_order_value:
          type: number
          format: double
          description: 平均訂單金額
        net_revenue:
          type: number
          format: double
          description: 淨營收（扣除退款）
        refund_total:
          type: number
          format: double
          description: 退款總額

    LeaderboardRow:
      type: object
      description: 排行榜單筆資料
      properties:
        name:
          type: string
        count:
          type: integer
        total:
          type: number
          format: double

    DashboardLeaderboard:
      type: object
      description: Dashboard 排行榜
      properties:
        top_products:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardRow'
          description: 熱銷商品排行
        top_customers:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardRow'
          description: 高消費顧客排行
        top_categories:
          type: array
          items:
            $ref: '#/components/schemas/LeaderboardRow'
          description: 熱門分類排行

    TrendDataPoint:
      type: object
      description: 趨勢圖資料點
      properties:
        date:
          type: string
          format: date
        revenue:
          type: number
          format: double
        orders:
          type: integer

    DashboardTrend:
      type: object
      description: Dashboard 趨勢圖資料
      properties:
        period:
          type: string
        interval:
          type: string
          enum:
            - day
            - week
            - month
        data:
          type: array
          items:
            $ref: '#/components/schemas/TrendDataPoint'

    RevenueReport:
      type: object
      description: 營收分析報表
      properties:
        period:
          type: string
        date_start:
          type: string
          format: date
        date_end:
          type: string
          format: date
        interval:
          type: string
          enum:
            - day
            - week
            - month
        totals:
          type: object
          properties:
            gross_revenue:
              type: number
              format: double
            net_revenue:
              type: number
              format: double
            refunds:
              type: number
              format: double
            taxes:
              type: number
              format: double
            shipping:
              type: number
              format: double
            orders:
              type: integer
        intervals:
          type: array
          items:
            $ref: '#/components/schemas/TrendDataPoint'

    BatchOrdersRequest:
      type: object
      description: 批量訂單操作請求
      properties:
        create:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        update:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        delete:
          type: array
          items:
            type: integer
          description: 要刪除的訂單 ID 陣列

    BatchVariationsRequest:
      type: object
      description: 批量商品變體操作請求
      properties:
        create:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariation'
        update:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariation'
        delete:
          type: array
          items:
            type: integer

    ErrorResponse:
      type: object
      description: 錯誤回應
      properties:
        code:
          type: string
          description: 錯誤代碼
        message:
          type: string
          description: 錯誤訊息
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP 狀態碼

    # ────────────────────────────
    # Profit Shop schemas
    # ────────────────────────────

    ProfitShopExceptionError:
      type: object
      description: |
        Profit Shop Domain Exception 對映後的錯誤回應（由 ExceptionMapper 產出）。

        對映表（spec §7.1 / §7.2 / §7.3）：
          - 404 not_found: ProfitShopNotFound / PartnerNotFound / ProductNotFound
          - 404 product_not_in_shop: ProductNotInShop
          - 400 validation_failed: InvalidPriceOverride / InvalidProfitRate / InvalidPartnerSlug / InvalidVariation / InvalidShopMode + fallback DomainException
          - 401 unauthorized: InvalidCredentials
          - 403 forbidden: Forbidden
          - 409 slug_conflict: SlugConflictException（含 conflicts 陣列）
          - 409 partner_in_use: PartnerStillInUseException
          - 409 product_already_in_shop: ProductAlreadyInShop
          - 422 invalid_state_transition: InvalidStatusTransition
          - 422 weak_password: WeakPassword（含 data.reasons[]，Phase 6-A1）
          - 422 legacy_unimportable: LegacyShopNotImportable（含 reason）
          - 429 rate_limited: TooManyAttempts / RateLimitExceeded（含 retry_after + Retry-After header）
          - 500 internal_error: PersistenceFailure / 其它 Throwable（含 error_id；生產環境 message 遮蔽）
      properties:
        code:
          type: string
          enum:
            - not_found
            - product_not_in_shop
            - validation_failed
            - unauthorized
            - forbidden
            - slug_conflict
            - partner_in_use
            - product_already_in_shop
            - invalid_state_transition
            - weak_password
            - legacy_unimportable
            - rate_limited
            - internal_error
        message:
          type: string
        conflicts:
          type: array
          description: code=slug_conflict 時附加，描述每筆衝突來源
          items:
            $ref: '#/components/schemas/SlugConflict'
        reason:
          type: string
          description: code=legacy_unimportable 時附加（reviewer L-1 / Phase 3-B observation）
        retry_after:
          type: integer
          description: code=rate_limited 時附加，秒數（同步 Retry-After header）
        error_id:
          type: string
          description: code=internal_error 時附加，格式 PS-{ts}-{rand}
        data:
          type: object
          description: |
            code=weak_password 時附加（Phase 6-A1）。
            `data.reasons` 為違反的密碼複雜度規則代碼陣列（如 `['too_short', 'missing_letter', 'missing_digit']`），
            前端據以做 i18n 並引導使用者修正（與 SlugConflictException 攜帶 conflicts 同模式）。
          properties:
            reasons:
              type: array
              items:
                type: string
                enum:
                  - too_short
                  - missing_letter
                  - missing_digit
      required:
        - code
        - message

    SlugConflict:
      type: object
      description: |
        Slug 衝突來源（spec §6.11）。BUG-1 修補後 conflict_kind 使用 enum 鎖死，
        且補上「既有 powershop CPT slug」與「既有 profit_partner term slug」兩類。
      properties:
        conflict_kind:
          type: string
          description: 衝突類型 machine code（與 SlugConflictDetector / CreatePartner 共用枚舉）
          enum:
            - wp_reserved      # WordPress 保留字
            - wc_page          # WooCommerce 核心 page slug
            - cpt              # 其他已註冊 CPT 的 rewrite slug（不含自家 powershop）
            - page             # 既有 page post_name
            - rewrite          # 自訂 rewrite rule prefix
            - powershop        # 既有 powershop CPT slug（BUG-1 補洞，spec §6.11 第 6 類）
            - profit_partner   # 既有 profit_partner term slug（BUG-1 補洞 + CreatePartner 統一）
        conflicting_slug:
          type: string
        conflicting_id:
          type: integer
          nullable: true
        conflicting_label:
          type: string
          description: 人類可讀的衝突資源名稱
      required:
        - conflict_kind
        - conflicting_slug
        - conflicting_label

    PriceOverride:
      type: object
      description: |
        單一價格覆寫（對應 Domain\ValueObject\PriceOverride）。
        三個欄位皆為 nullable string，null 表示「不覆寫該欄位、沿用商品原價」。
        非 null 值必須為合法非負十進位字串；
        若 sale_price 與 regular_price 皆非 null，sale_price 必須 <= regular_price
        （違反時 ExceptionMapper 回 400 validation_failed）。
      properties:
        regular_price:
          type: string
          nullable: true
          description: 原價覆寫
        sale_price:
          type: string
          nullable: true
          description: 特價覆寫
        signup_fee:
          type: string
          nullable: true
          description: 訂閱型商品註冊費覆寫
      required:
        - regular_price
        - sale_price
        - signup_fee

    OverrideItemInput:
      type: object
      description: |
        賣場商品覆寫項目（input 形式）。

        ⚠️ BUG-A 修補（2026-07-29）：本 schema 原先定義為扁平的
        `{ product_id, variation_id, price_override: integer, inflated_count }`，
        與後端 Domain\Entity\OverrideItem::to_array() 的巢狀形狀不符。
        ProfitShopHydrator::build_override_item() 只讀 `override` / `variations`，
        導致前端送出的 `price_override` / `variation_id` 於儲存時被靜默丟棄。
        現已對齊 Domain 形狀，扁平欄位不再使用。
      properties:
        product_id:
          type: integer
        inflated_count:
          type: integer
          default: 0
          description: 浮報數量（fake count，不影響庫存）
        override:
          allOf:
            - $ref: '#/components/schemas/PriceOverride'
          description: 商品自身的價格覆寫
        variations:
          type: object
          description: |
            variation_id => { override, inflated_count } 對照表。
            key 為 variation ID 字串。
            variation 必須屬於同筆的 product_id，否則 ItemValidator 拋 InvalidVariation。

            Phase 9（2026-07-30）起 value 物件新增 `inflated_count`，讓可變商品能逐變體
            設定灌水購買人數；賣場編輯頁的「賣場商品」表格可展開 variable /
            variable-subscription 商品逐一編輯。
            向後相容：Phase 9 之前寫入的資料無此鍵，
            CptProfitShopRepository::build_override_item() 以 `?? 0` 接住，不需 migration。
          additionalProperties:
            type: object
            properties:
              override:
                $ref: '#/components/schemas/PriceOverride'
              inflated_count:
                type: integer
                default: 0
                minimum: 0
                description: |
                  該變體的灌水購買人數（fake count，不影響庫存）。
                  缺鍵視為 0；負數由 InflatedCount VO sanitize 為 0。
                  ⚠️ 目前賣場前台只渲染父商品卡片，變體層 inflated_count
                  尚無前台顯示位置（見 specs/tech-debt.md TD-15）。
      required:
        - product_id

    OverrideItemOutput:
      allOf:
        - $ref: '#/components/schemas/OverrideItemInput'
        - type: object
          description: |
            ⚠️ 不含 sku / name / image。
            商品名稱與 SKU 屬「商品當下狀態」而非賣場設定，
            夾帶會造成商品改名後賣場顯示舊名的 stale 問題，
            且違反 Domain 純度（Application 層為 UI 便利去 enrich WC 資料）。
            前端改以 wc-rest `GET /wc/v3/products?include=…` 批次補齊，
            見 specs/features/profit-shop/enrich-shop-item-display.feature。

    ProfitShopInput:
      type: object
      description: |
        分潤賣場 Admin 寫入 DTO（建立 / 更新）。
        對應 PHP class `J7\PowerShop\Domains\ProfitShop\Application\DTO\ProfitShopInput`。
      properties:
        id:
          type: integer
          nullable: true
          description: 建立時為 null
        title:
          type: string
        slug:
          type: string
          description: 將經 SlugConflictDetector 5 類衝突檢查（spec §6.11）
        status:
          type: string
          enum:
            - publish
            - draft
            - trash
          default: draft
        mode:
          type: string
          enum:
            - page
            - shortcode
          default: page
        partner_term_id:
          type: integer
          description: 對應 profit_partner term ID
        rate:
          type: integer
          minimum: 0
          maximum: 100
          description: 分潤比例（%）
        items:
          type: array
          items:
            $ref: '#/components/schemas/OverrideItemInput'
        settings:
          type: object
          additionalProperties: true
      required:
        - title
        - slug
        - partner_term_id
        - rate

    ProfitShopOutput:
      type: object
      description: 分潤賣場讀取 DTO
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        status:
          type: string
          enum:
            - publish
            - draft
            - trash
        mode:
          type: string
          enum:
            - page
            - shortcode
        partner_term_id:
          type: integer
        rate:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/OverrideItemOutput'
        settings:
          type: object
          additionalProperties: true
        created_at:
          type: string
          description: Y-m-d H:i:s
        updated_at:
          type: string
          description: Y-m-d H:i:s
      required:
        - id
        - title
        - slug
        - status
        - mode
        - partner_term_id
        - rate
        - items
        - settings
        - created_at
        - updated_at

    PartnerInput:
      type: object
      description: |
        Partner 寫入 DTO（建立 / 更新）。
        **@internal**：含明文密碼，僅出現於 request；**禁止**回傳於 response（
        PartnerInput::to_array() 不可序列化到 REST response，對外請使用 PartnerOutput）。
      properties:
        id:
          type: integer
          nullable: true
          description: 建立時為 null
        name:
          type: string
        slug:
          type: string
          description: Partner slug（唯一）
        contact_email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          format: password
          nullable: true
          description: 明文密碼（null 代表不變更）；server 端會以 wp_hash_password 雜湊後存 termmeta
        image_id:
          type: integer
          nullable: true
          description: |
            夥伴圖片 attachment ID，存於 termmeta `_partner_image_id`。
            `null` / `0` / 負數一律正規化為 null，並**刪除**既有 termmeta（= 移除夥伴圖片）。
            **只接受 image_id**，不接受 image_url——URL 是唯讀衍生欄位（見 PartnerOutput.image_url）。
      required:
        - name
        - slug

    PartnerOutput:
      type: object
      description: |
        Partner 讀取 DTO。

        ⚠️ **含明文密碼欄位（`password`），僅供 admin-only endpoint 使用。**
        絕不可用於任何 partner-facing endpoint（`GET /partner-auth/me` 刻意自行列舉欄位輸出）。
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        contact_email:
          type: string
          format: email
          nullable: true
        created_at:
          type: string
          description: Y-m-d H:i:s
        image_id:
          type: integer
          nullable: true
          description: 夥伴圖片 attachment ID；未設定時為 null
        image_url:
          type: string
          format: uri
          nullable: true
          description: |
            夥伴圖片 URL（`thumbnail` size），由 image_id 於讀取時即時解析的**唯讀衍生欄位**。
            attachment 已被刪除時為 null 但 image_id 仍保留（孤兒 ID 不自動清除），
            因此「image_id 非 null 但 image_url 為 null」是合法狀態，UI 需退回預設頭像。
        report_url:
          type: string
          format: uri
          nullable: true
          description: |
            夥伴報表頁完整網址（`/profit-report/{partner-slug}/`），
            由 slug 加上 report 前綴（`RewriteRules::get_report_slug()`）
            於讀取時即時組出的**唯讀衍生欄位**，不持久化、PartnerInput 也不接受它。
            前綴為固定常數（站長無法修改），但前端仍**不可**自行拼接網址：
            組成規則的真相來源只有 PHP 端，複製一份到前端會在日後前綴變動時
            安靜地連到 404。一律使用本欄位。
        password:
          type: string
          nullable: true
          description: |
            夥伴報表登入密碼的**明文**，供站長在後台查看 / 複製後轉交夥伴（admin-only）。

            後端除了不可逆的 `wp_hash_password` 雜湊（登入驗證的唯一依據）之外，
            另存一份明文於 `_partner_password_plain` termmeta。這是站長明確要求的取捨：
            「複製密碼」在只存雜湊的前提下技術上不可能。

            `null` 代表該夥伴建立於此功能上線之前（DB 只有雜湊、無明文可還原），
            這是合法狀態；重設一次密碼後即補上。UI 需據實顯示「無法顯示」而非空白，
            否則站長會誤以為密碼是空的。
      required:
        - id
        - name
        - slug
        - created_at

    # SettingsDto 已整組移除（連同 GET/PUT/POST /power-shop/profit-settings 三個 endpoint）。
    # 它剩下的兩個欄位都是「有消費點，但不該讓站長改」：
    #   - report_slug：一改就讓所有已發給 partner 的報表網址失效
    #   - rewrite_slug：控制的 /{slug}/{post-name}/ 沒有任何程式碼連過去，
    #     打開只有佈景主題 single + post_content（商品 grid 只在 ProfitShopRenderer
    #     走 profit_shop_slug query var 時才渲染）
    # 兩者現為 CptRegistrar::DEFAULT_REWRITE_SLUG / RewriteRules::DEFAULT_REPORT_SLUG 固定常數。
    # wp_options 殘留的 power_shop_profit_settings 成孤兒、無人讀寫，不需要 migration。

    LegacyShopRef:
      type: object
      description: 可遷入的 legacy 一頁商店參照（profit-migration/legacy-shops 列表項）
      properties:
        legacy_id:
          type: integer
        title:
          type: string
        slug:
          type: string
        importable:
          type: boolean
