          type: string
          format: password
      required:
        - slug
        - password

    PartnerLoginOutput:
      type: object
      description: |
        Partner 登入回應。
        **不裹** `{code, data}`（spec §4.4，partner endpoint 慣例差異）。
        `expires_at` 為 unix timestamp 字串化（前端 parseInt 即得秒數）。
      properties:
        token:
          type: string
          description: Partner token；後續 request 透過 X-Partner-Token / Bearer / Cookie 任一帶入
        expires_at:
          type: string
          description: unix timestamp 字串化（如 "1746623200"）
        partner_id:
          type: integer
        partner_name:
          type: string
      required:
        - token
        - expires_at
        - partner_id
        - partner_name

    PartnerMeOutput:
      type: object
      description: Partner /me 端點回應（裸 payload，不裹 code/data）
      properties:
        partner_id:
          type: integer
        partner_name:
          type: string
        partner_slug:
          type: string
        contact_email:
          type: string
          format: email
          nullable: true
      required:
        - partner_id
        - partner_name
        - partner_slug

    KpiOutput:
      type: object
      description: |
        Partner KPI 報表（spec §6 / §7）。
        所有金額欄位採字串保存以保留小數精度。
      properties:
        total_sales:
          type: string
          description: 總銷售額（如 "12345.67"）
        profit_pending:
