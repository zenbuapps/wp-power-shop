      summary: 下架分潤賣場
      operationId: unpublishProfitShop
      security:
        - WPNonce: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 下架成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    $ref: '#/components/schemas/ProfitShopOutput'
        '404':
          description: not_found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'
        '422':
          description: invalid_state_transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitShopExceptionError'

  /power-shop/profit-shops/{id}/duplicate:
    post:
      tags:
        - ProfitShop
      summary: 複製分潤賣場
      operationId: duplicateProfitShop
      security:
        - WPNonce: []
      parameters:
        - name: id
          in: path
          required: true
