    SettlementListItem:
      type: object
      description: Settlement 結算記錄單筆
      properties:
        order_id:
          type: integer
        order_item_id:
          type: integer
        product_id:
          type: integer
        shop_id:
          type: integer
        sale_amount:
          type: string
        profit_amount:
          type: string
        status:
          type: string
          enum:
            - pending
            - paid
            - refunded
        created_at:
          type: string
          format: date-time

    SettlementListOutput:
      type: object
      description: Partner 結算列表（裸 payload，含分頁中介資料）
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SettlementListItem'
        total:
          type: integer
        page:
          type: integer
          minimum: 1
        per_page:
          type: integer
      required:
        - items
        - total
        - page
        - per_page

    SlugValidationOutput:
      type: object
      description: |
        Slug 驗證結果（GET /profit-shops/validate-slug）。
        available=true 時 conflicts 為空陣列；available=false 時列出所有衝突來源。
      properties:
        slug:
          type: string
        available:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/SlugConflict'
      required:
        - slug
        - available
        - conflicts

    RegeneratePasswordOutput:
      type: object
      description: |
        重新產生 Partner 密碼回應（裸 payload）。
        Response 強制 `Cache-Control: no-store, no-cache, must-revalidate` + `Pragma: no-cache`，
        防範密碼明文被 proxy / browser 快取。
      properties:
        partner_id:
          type: integer
        password:
          type: string
          description: 新密碼明文（12 字元 wp_generate_password；前端必須立即顯示後丟棄）
      required:
        - partner_id
        - password

    LogoutOutput:
      type: object
      description: 登出回應（裸 payload，idempotent）
      properties:
        logged_out:
          type: boolean
      required:
        - logged_out

    ChangePasswordRequest:
      type: object
      description: |
        Partner 自助修密碼請求 body（Phase 6-A1）。

        - `current_password`：當前明文密碼（**不過 sanitize_text_field**，保留字面值）
        - `new_password`：新明文密碼（**不過 sanitize_text_field**；
          後端用 `PartnerPassword` ValueObject 驗證複雜度，違反拋 WeakPassword → 422 weak_password）

        partner_term_id 鎖死於 token，**不出現**在此 body（永不接受 query / body 注入）。
      properties:
        current_password:
          type: string
          description: 當前明文密碼
          example: 'Old1234ABC'
        new_password:
          type: string
          description: 新明文密碼（複雜度規則：mb_strlen UTF-8 ≥ 8 + ≥ 1 英文 + ≥ 1 數字）
          example: 'NewSecret123'
      required:
        - current_password
        - new_password

    ChangePasswordResponse:
      type: object
      description: |
        Partner 自助修密碼成功回應（裸 payload，Phase 6-A1）。

        永不含密碼 / hash / token；可安全序列化 / 可進 client cache（即使本 endpoint 響應強制 no-store）。
        前端可選擇用 `password_changed_at` 顯示「上次改密時間」；
        後端用同值寫入 termmeta `_partner_password_changed_at`，作為
        `PartnerTokenStore::verify` 比對「token 簽發時間 <= password_changed_at → 視為已撤銷」的依據
        （reviewer M-1：嚴格大於才通過，閉合同秒 race window）。
      properties:
        success:
          type: boolean
          description: 是否成功（目前 happy path 永遠 true，保留欄位以便未來擴充 partial success）
          example: true
        password_changed_at:
          type: integer
          description: 變更後的 password_changed_at（unix timestamp）
          example: 1715000000
      required:
        - success
        - password_changed_at

    # ──────────────────────────── Settlements（後台結算頁，spec §3.5 / §4.3）

    SettlementFilterInput:
      type: object
      description: |
        後台結算查詢的過濾條件（spec §4.3）。GET 端點走 query string，
        POST /export 走 body。所有 ID 欄位會被轉成正整數並去重；
        **不在白名單內的 status 一律回 400 validation_failed，不會被靜默丟棄**
        （靜默丟棄會讓過濾條件退化成「不過濾」，站長會誤讀成篩選結果）。

        單數與複數鍵名皆可（`partner_id` / `partner_ids` / `partner_term_id` /
        `partner_term_ids`），同時出現時取聯集；字串值以逗號分隔。
      properties:
        partner_term_ids:
          type: array
          items:
            type: integer
          description: 分潤夥伴 term ID 過濾（空 = 不限）
        shop_ids:
          type: array
          items:
            type: integer
          description: 賣場 ID 過濾（空 = 不限）
        statuses:
          type: array
          items:
            type: string
            enum: [pending, paid, refunded, cancelled]
          description: 結算狀態過濾（空 = 不限）
        date_start:
          type: integer
          nullable: true
          description: 訂單建立起始時間（unix timestamp，null = 不限）
        date_end:
          type: integer
          nullable: true
          description: 訂單建立結束時間（unix timestamp，null = 不限）
        page:
          type: integer
          default: 1
          maximum: 10000
        per_page:
          type: integer
          default: 20
          maximum: 100

    AdminSettlementListItem:
      type: object
      description: 後台結算列表的單筆項目
      properties:
        order_item_id:
          type: integer
        order_id:
          type: integer
        product_name:
          type: string
          description: 下單當下凍結的商品名稱（order_item_name）
        partner_term_id:
          type: integer
        partner_name:
          type: string
          description: |
            分潤夥伴名稱。夥伴已被刪除時為 `[已停用夥伴]`——**該列不可消失**，
            金額已凍結，那筆錢仍然要付給人。
          example: 夥伴A
        shop_id:
          type: integer
        shop_name:
          type: string
          description: 分潤賣場名稱。賣場已被刪除時為 `[已刪除賣場]`（同上，該列不可消失）。
          example: 夏季賣場
        actual_price:
          type: string
          description: 成交金額（十進位字串，保留精度）
          example: '500.00'
        profit_amount:
          type: string
          description: 應分潤金額（十進位字串，保留精度）
          example: '100.00'
        rate:
          type: integer
          description: 分潤比例（0-100，凍結值）
        status:
          type: string
          enum: [pending, paid, refunded, cancelled]
        needs_manual_rate:
          type: boolean
          description: |
            🔴 分潤比例為 0，需站長人工設定。結帳當下賣場已被刪除時，寫入 hook 會刻意
            寫下完整歸屬 meta 但 `rate = 0` / `amount = '0.00'`（而不是不寫），
            好讓這筆錢仍看得見、可人工補救。**這種紀錄絕不可被過濾掉**——
            過濾等於讓一筆該付的錢從系統中消失。前端應標紅提示「賣場已刪除，需人工設定比例」。
        settled_at:
          type: integer
          nullable: true
          description: 撥款時間（unix timestamp；未撥款為 null）
        order_date:
          type: string
          description: 訂單建立時間（GMT，`Y-m-d H:i:s`）
      required:
        - order_item_id
        - order_id
        - partner_name
        - shop_name
        - profit_amount
        - status

    AdminSettlementListOutput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminSettlementListItem'
        total:
          type: integer
          description: 符合條件的總筆數（**不是**當前頁筆數）
        page:
          type: integer
        per_page:
          type: integer
      required:
        - items
        - total
        - page
        - per_page

    SettlementAdminSummaryOutput:
      type: object
      description: |
        後台結算摘要卡（spec §3.5「待撥款金額（筆數） / 已撥款金額（筆數） / 退款金額」）。
        **所有金額欄位都是十進位字串**（bcmath 產出）——這些數字會直接變成轉給夥伴的
        金額，轉成 float 累加會出現分位誤差。摘要忽略 page / per_page，永遠涵蓋整個篩選結果。
      properties:
        pending_amount:
          type: string
          example: '1500.00'
        pending_count:
          type: integer
        paid_amount:
          type: string
        paid_count:
          type: integer
        refunded_amount:
          type: string
        refunded_count:
          type: integer
        cancelled_amount:
          type: string
        cancelled_count:
          type: integer
        total_sales:
          type: string
          description: 成交金額合計（actual_price 加總）
        total_count:
          type: integer

    SettlementBatchRequest:
      type: object
      description: mark-paid / mark-cancelled / reverse-paid 共用的請求 body
      properties:
        order_item_ids:
          type: array
          items:
            type: integer
          minItems: 1
          maxItems: 500
          description: |
            要處理的 order_item_id 清單。空清單或超過 500 筆一律 400 validation_failed
            （後者是 DoS 防護）。重複的 ID 只會被處理一次。
      required:
        - order_item_ids

    SettlementBatchOutput:
      type: object
      description: |
        批次操作結果。**被跳過的項目一定會出現在 `skipped` 並附原因**——
        兩位管理員同時撥款時，第二個人必須看到「這些已經是 paid、本次未重複計入」，
        否則他會以為自己那次沒生效而真的再去轉一次帳（spec §5.5）。
      properties:
        updated_ids:
          type: array
          items:
            type: integer
          description: 實際完成狀態轉換的 order_item_id
        updated_count:
          type: integer
        skipped:
          type: object
          additionalProperties:
            type: string
          description: 'order_item_id => 被跳過的原因（JSON 化後鍵為字串）'
          example:
            '456': '目前狀態為 paid，只有待撥款（pending）可標記為已撥款，本次未重複計入'
        skipped_count:
          type: integer
        total_amount:
          type: string
          description: 本次異動的分潤金額合計（十進位字串）
          example: '250.00'
        audit_log_failed_partner_ids:
          type: array
          items:
            type: integer
          description: |
            狀態已更新但 `_partner_settled_log` 稽核紀錄寫入失敗的 partner term ID。
            這是**部分成功**而非失敗——不可與 `skipped` 混為一談，否則站長會以為
            那些品項沒被撥款而重撥。
      required:
        - updated_ids
        - skipped
        - total_amount

    SettlementExportOutput:
      type: object
      description: |
        CSV 匯出結果（決策 D-5）。以 `{code, message, data}` 包 base64 字串而非直接串流
        `text/csv`，理由有二：

        1. 後台端點一律是這個外層形狀，前端讀取時依賴它（`useCustom` 要剝兩層）；
           串流原始 CSV 會讓這條路徑變成唯一的例外。
        2. 錯誤（權限不足、篩選條件非法）能以一般的 JSON 錯誤格式回應，而不是讓使用者
           下載到一個內容其實是錯誤訊息的 .csv。

        用 base64 而非原始字串：內容開頭有 UTF-8 BOM，中間有 CRLF 換行與引號跳脫，
        這些位元組在 JSON 編解碼與各層 proxy 的字元集轉換中都可能被改動，
        而 BOM 少一個位元組 Excel 就會以系統預設編碼開啟，中文欄位整片亂碼。

        前端解碼：先 atob 再轉 Uint8Array，最後包成 Blob（type 取 mime_type）觸發下載。

        每一格都經過試算表公式注入中和（spec §6.9）：開頭為 `=` `+` `-` `@`
        （含前置空白、定位字元或歸位字元之後才出現者）一律前綴單引號。
        🔴 商品名稱、分潤夥伴、分潤賣場三欄都是使用者可輸入的字串，三個都要跳脫——
        只跳脫商品名稱的話，攻擊者改用賣場名稱即可。

        CSV 欄位固定 9 欄，順序與標題由 export-settlements-csv.feature 逐字鎖定：
        訂單編號／訂單品項編號／商品名稱／分潤夥伴／分潤賣場／實際單價／應分潤金額／結算狀態／訂單日期
      properties:
        filename:
          type: string
          description: 含日期，避免多次匯出互相覆蓋
          example: profit-settlements-20260806-113000.csv
        mime_type:
          type: string
          example: text/csv; charset=utf-8
        content_base64:
          type: string
          description: CSV 全文的 base64。解碼後開頭含 UTF-8 BOM。
        row_count:
          type: integer
          description: 資料列數（不含表頭）
      required:
        - filename
        - mime_type
        - content_base64
        - row_count

    SettlementOrderIdsOutput:
      type: object
      description: |
        符合分潤條件的 order_id 清單（決策 D-6）。

        WooCommerce REST 的 `orders` 端點**無法依 order item meta 篩選**，
        分潤歸屬寫在 line item 上、不在訂單本體。因此「只看某個賣場的訂單」得分兩步：
        先向本端點拿 order_id 陣列，再當成 `wc-rest` 的 `include` filter 送出。
      properties:
        order_ids:
          type: array
          items:
            type: integer
          description: 訂單 ID（新到舊）
        total:
          type: integer
          description: 符合條件的訂單總數（**未受 limit 影響**，用來算出 truncated）
        limit:
          type: integer
          description: 本次套用的上限（最大 200）
        truncated:
          type: boolean
          description: |
            🔴 是否因超過上限而被截斷。為 true 時前端**必須**提示「結果過多，請縮小篩選範圍」——
            靜默截斷會讓站長看到一份不完整的訂單列表卻毫無徵兆，
            直接得出「這個賣場只有這幾張訂單」的錯誤結論。
      required:
        - order_ids
        - total
        - limit
        - truncated

  parameters:
    PartnerToken:
      name: X-Partner-Token
      in: header
      description: |
        Partner token（spec §4.5 / §6.3）。
        三條讀取路徑優先級鏈（高 → 低）：
          1. `X-Partner-Token`
          2. `Authorization: Bearer {token}`
          3. Cookie `profit_partner_token`（瀏覽器自動帶）
        三選一即可。SPA 推薦走 X-Partner-Token（與 X-WP-Nonce 對稱）。
      required: false
      schema:
        type: string
    AuthBearer:
      name: Authorization
      in: header
      description: '`Bearer {token}`（partner_token 三條路徑之一）'
      required: false
      schema:
        type: string
    PartnerCookie:
      name: Cookie
      in: header
      description: |
        `profit_partner_token={token}`；Set-Cookie 屬性：
        HttpOnly + Secure + SameSite=Lax + Path=/wp-json/power-shop/ + Max-Age=3600。
      required: false
      schema:
        type: string

paths:

  # ────────────────────────────
  # Dashboard
  # ────────────────────────────

  /power-shop/reports/dashboard/stats:
    get:
      tags:
        - Dashboard
      summary: 查詢 Dashboard KPI 統計
      operationId: getDashboardStats
      security:
        - WPNonce: []
      parameters:
        - name: period
          in: query
          description: 統計期間
          schema:
            type: string
            enum:
              - today
              - yesterday
              - week
              - month
              - year
              - custom
            default: month
        - name: date_start
          in: query
          description: 自訂期間起始日（period=custom 時使用）
          schema:
            type: string
            format: date
        - name: date_end
          in: query
          description: 自訂期間結束日（period=custom 時使用）
          schema:
            type: string
            format: date
      responses:
        '200':
          description: KPI 統計資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'
        '400':
          description: 參數錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /power-shop/reports/dashboard/leaderboard:
    get:
      tags:
        - Dashboard
      summary: 查詢排行榜
      operationId: getDashboardLeaderboard
      security:
        - WPNonce: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum:
              - today
              - yesterday
              - week
              - month
              - year
              - custom
            default: month
        - name: date_start
          in: query
          schema:
            type: string
            format: date
        - name: date_end
          in: query
          schema:
            type: string
            format: date
        - name: limit
          in: query
          description: 各排行榜最大回傳筆數
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 50
      responses:
        '200':
          description: 排行榜資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardLeaderboard'
        '400':
          description: 參數錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /power-shop/reports/dashboard/trend:
    get:
      tags:
        - Dashboard
      summary: 查詢營收趨勢圖表
      operationId: getDashboardTrend
      security:
        - WPNonce: []
      parameters:
        - name: period
          in: query
          schema:
            type: string
            enum:
              - today
              - yesterday
              - week
              - month
              - year
              - custom
            default: month
        - name: interval
          in: query
          description: 資料分組粒度
          schema:
            type: string
            enum:
              - day
              - week
              - month
            default: day
        - name: date_start
          in: query
          schema:
            type: string
            format: date
        - name: date_end
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 趨勢圖表資料
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardTrend'
        '400':
          description: 參數錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────
  # Orders
  # ────────────────────────────

  /wc/v3/orders:
    get:
      tags:
        - Orders
      summary: 查詢訂單列表
      operationId: listOrders
      security:
        - WPNonce: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: search
          in: query
          description: 搜尋訂單編號、顧客姓名、Email
          schema:
            type: string
        - name: status
          in: query
          description: 篩選訂單狀態
          schema:
            type: string
            enum:
              - pending
              - processing
              - on-hold
              - completed
              - cancelled
              - refunded
              - failed
              - any
        - name: customer
          in: query
          description: 篩選特定顧客（customer_id）
          schema:
            type: integer
        - name: date_min
          in: query
          description: 建立日期下限（ISO 8601 date）
          schema:
            type: string
            format: date
        - name: date_max
          in: query
          description: 建立日期上限（ISO 8601 date）
          schema:
            type: string
            format: date
        - name: orderby
          in: query
          schema:
            type: string
            enum:
              - date
              - id
              - include
              - title
              - slug
            default: date
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
        '200':
          description: 訂單列表
          headers:
            X-WP-Total:
              description: 符合條件的總筆數
              schema:
                type: integer
            X-WP-TotalPages:
              description: 總頁數
              schema:
                type: integer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Orders
      summary: 建立訂單
      operationId: createOrder
      security:
        - WPNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '201':
          description: 訂單建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: 參數錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wc/v3/orders/batch:
    post:
      tags:
        - Orders
      summary: 批量刪除訂單
      operationId: batchDeleteOrders
      description: 透過 delete 陣列批量刪除訂單（WooCommerce batch API）
      security:
        - WPNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchOrdersRequest'
      responses:
        '200':
          description: 批量操作結果
          content:
            application/json:
              schema:
                type: object
                properties:
                  create:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  update:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  delete:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
        '400':
          description: 參數錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wc/v3/orders/{id}:
    put:
      tags:
        - Orders
      summary: 更新訂單狀態或地址
      operationId: updateOrder
      security:
        - WPNonce: []
      parameters:
        - name: id
          in: path
          required: true
          description: 訂單 ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Order'
      responses:
        '200':
          description: 訂單更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          description: 參數錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 訂單不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wc/v3/orders/{id}/notes:
    post:
      tags:
        - Orders
      summary: 新增訂單備註
      operationId: createOrderNote
      security:
        - WPNonce: []
      parameters:
        - name: id
          in: path
          required: true
          description: 訂單 ID
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - note
              properties:
                note:
                  type: string
                  description: 備註內容
                customer_note:
                  type: boolean
                  default: false
                  description: 是否顯示給顧客
      responses:
        '201':
          description: 備註新增成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderNote'
        '400':
          description: 參數錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 訂單不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ────────────────────────────
  # Products
  # ────────────────────────────

  /wc/v3/products/categories:
    get:
      tags:
        - Products
      summary: 查詢商品分類列表
      operationId: listProductCategories
      security:
        - WPNonce: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 100
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: parent
          in: query
          description: 篩選指定父分類的子分類（0 = 頂層）
          schema:
            type: integer
        - name: hide_empty
          in: query
          description: 隱藏無商品的分類
          schema:
            type: boolean
            default: false
        - name: orderby
          in: query
          schema:
            type: string
            enum:
              - id
              - include
              - name
              - slug
              - term_group
              - description
              - count
            default: name
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        '200':
          description: 商品分類列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductCategory'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Products
      summary: 新增商品分類
      operationId: createProductCategory
      security:
        - WPNonce: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCategory'
      responses:
        '201':
          description: 分類建立成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCategory'
        '400':
          description: 參數錯誤
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 無權限
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /wc/v3/products:
    get:
      tags:
        - Products
      summary: 查詢商品列表
      operationId: listProducts
      security:
        - WPNonce: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum:
              - publish
              - draft
              - trash
              - any
        - name: type
          in: query
          schema:
            type: string
            enum:
              - simple
              - variable
              - grouped
              - external
              - subscription
              - variable-subscription
        - name: category
          in: query
          description: 分類 slug 或 ID
          schema:
            type: string
        - name: tag
          in: query
          description: 標籤 slug 或 ID
          schema:
            type: string
        - name: sku
          in: query
          schema:
            type: string
        - name: stock_status
          in: query
          schema:
            type: string
            enum:
              - instock
              - outofstock
              - onbackorder
        - name: orderby
          in: query
          schema:
            type: string
            enum:
              - date
              - id
              - include
              - title
              - slug
              - price
              - popularity
              - rating
            default: date
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
      responses:
